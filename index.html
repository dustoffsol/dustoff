<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dustoff — Reclaim the SOL locked in empty token accounts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@solana/web3.js@1.98.0/lib/index.iife.min.js"></script>
<style>
:root{--bg:#07060b;--panel:#100e1a;--line:#26203d;--violet:#8b5cf6;--lilac:#c4b5fd;--text:#f4f2fb;--mute:#9a94b3}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(700px 420px at 50% -80px,#6d3fe055,transparent 70%),var(--bg);color:var(--text);font-family:Manrope,system-ui,sans-serif;line-height:1.65;min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:var(--lilac)}
header,main,footer{max-width:760px;margin:0 auto;padding:0 22px}
header{display:flex;justify-content:space-between;align-items:center;padding-top:24px;padding-bottom:24px}
.logo{font-weight:800;font-size:1.3rem;letter-spacing:-.03em}
.logo span{color:var(--violet)}
button{font:inherit;cursor:pointer;border:0;border-radius:999px;padding:12px 24px;font-weight:700;color:#fff;background:var(--violet);box-shadow:0 8px 28px -8px #8b5cf6aa;transition:transform .15s,box-shadow .15s,background .15s}
button:hover{background:#9d74fa;transform:translateY(-1px)}
button:focus-visible{outline:3px solid var(--lilac);outline-offset:3px}
button:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--text);box-shadow:none}
button.ghost:hover{background:#ffffff0d}
.space{max-width:760px;margin:0 auto;padding:0 22px}
.space svg{display:block;width:100%;height:auto;overflow:visible}
.f1{animation:bob 5s ease-in-out infinite}
.f2{animation:bob 7s ease-in-out -2s infinite}
@keyframes bob{0%,100%{translate:0 0}50%{translate:6px -8px}}
@media (prefers-reduced-motion:reduce){.f1,.f2{animation:none}}
h1{font-size:clamp(2.4rem,8vw,4.2rem);line-height:1.04;letter-spacing:-.04em;margin:12px 0 16px;font-weight:800;text-align:center}
.lead{color:var(--mute);max-width:52ch;font-size:1.08rem;margin:0 auto 36px;text-align:center}
.card{background:linear-gradient(180deg,#171329,var(--panel));border:1px solid var(--line);border-radius:28px;padding:34px 28px;text-align:center;box-shadow:0 30px 80px -30px #8b5cf655}
.label{color:var(--mute);font-weight:600;font-size:.95rem}
.big{font-size:clamp(2.8rem,12vw,4.6rem);font-weight:800;letter-spacing:-.04em;line-height:1.1;margin:6px 0;color:var(--lilac);text-shadow:0 0 40px #8b5cf688}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:center;margin-top:24px}
#status{color:var(--mute);margin:16px 0 0;min-height:1.6em}
#status.err{color:#ff8fa8}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:28px;margin:56px 0}
.how div{border-top:2px solid var(--violet);padding-top:14px}
.how h3{margin:0 0 6px;font-size:1.05rem}
.how p{margin:0;color:var(--mute);font-size:.93rem}
footer{color:var(--mute);font-size:.82rem;padding-top:10px;padding-bottom:48px;text-align:center}
@media (prefers-reduced-motion:reduce){button{transition:none}}
</style>
</head>
<body>
<header>
  <div class="logo">Dust<span>off</span></div>
  <button id="connect">Connect wallet</button>
</header>
<div class="space" aria-hidden="true">
<svg viewBox="0 0 760 210" role="img" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="pA" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#c4b5fd"/><stop offset=".55" stop-color="#8b5cf6"/><stop offset="1" stop-color="#3b1d8f"/></radialGradient>
    <radialGradient id="pB" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#f0abfc"/><stop offset="1" stop-color="#6d28d9"/></radialGradient>
    <radialGradient id="pC" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#ddd6fe"/><stop offset="1" stop-color="#4c1d95"/></radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c4b5fd" stop-opacity=".35"/><stop offset="1" stop-color="#c4b5fd" stop-opacity="0"/></linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9e5ff"/><stop offset="1" stop-color="#7c6bb8"/></linearGradient>
